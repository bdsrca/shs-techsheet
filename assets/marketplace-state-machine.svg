<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="860" viewBox="0 0 1400 860">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fbff"/>
      <stop offset="100%" stop-color="#eef5ff"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#1e3a8a" flood-opacity="0.12"/>
    </filter>
    <style>
      .title{font-family:Inter,Segoe UI,Arial,sans-serif;font-size:42px;font-weight:800;fill:#0f172a}
      .sub{font-family:Inter,Segoe UI,Arial,sans-serif;font-size:18px;fill:#475569}
      .h{font-family:Inter,Segoe UI,Arial,sans-serif;font-size:20px;font-weight:800;fill:#0f172a}
      .t{font-family:Inter,Segoe UI,Arial,sans-serif;font-size:15px;fill:#334155}
      .small{font-family:Inter,Segoe UI,Arial,sans-serif;font-size:13px;fill:#475569}
      .label{font-family:Inter,Segoe UI,Arial,sans-serif;font-size:14px;font-weight:700;fill:#1d4ed8}
      .card{fill:#ffffff;stroke:#bfdbfe;stroke-width:1.4;rx:22;filter:url(#shadow)}
      .soft{fill:#eff6ff;stroke:#bfdbfe;stroke-width:1.2;rx:16}
      .green{fill:#ecfdf5;stroke:#86efac}
      .orange{fill:#fff7ed;stroke:#fdba74}
      .purple{fill:#f5f3ff;stroke:#c4b5fd}
      .red{fill:#fff1f2;stroke:#fda4af}
      .line{stroke:#2563eb;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}
      .dash{stroke:#93c5fd;stroke-width:2;stroke-dasharray:6 8;fill:none}
    </style>
  </defs>
  <rect width="1400" height="860" rx="28" fill="url(#bg)"/>
<text x="54" y="70" class="title">Marketplace State Machine</text><text x="56" y="105" class="sub">A listing is controlled by three state dimensions, not one overloaded status field.</text><text x="70" y="210" class="h">Publication status</text><rect x="370" y="180" width="190" height="80" class="soft"/><text x="398" y="228" class="h">Draft</text><path d="M560 220 H610" class="line"/><rect x="610" y="180" width="190" height="80" class="soft"/><text x="638" y="228" class="h">Published</text><path d="M800 220 H850" class="line"/><rect x="850" y="180" width="190" height="80" class="soft"/><text x="878" y="228" class="h">Paused</text><path d="M1040 220 H1090" class="line"/><rect x="1090" y="180" width="190" height="80" class="soft"/><text x="1118" y="228" class="h">Archived</text><text x="70" y="380" class="h">Moderation status</text><rect x="370" y="350" width="190" height="80" class="soft"/><text x="398" y="398" class="h">Normal</text><path d="M560 390 H610" class="line"/><rect x="610" y="350" width="190" height="80" class="soft"/><text x="638" y="398" class="h">Flagged</text><path d="M800 390 H850" class="line"/><rect x="850" y="350" width="190" height="80" class="soft"/><text x="878" y="398" class="h">Under review</text><path d="M1040 390 H1090" class="line"/><rect x="1090" y="350" width="190" height="80" class="soft"/><text x="1118" y="398" class="h">Removed</text><text x="70" y="550" class="h">Sale status</text><rect x="370" y="520" width="190" height="80" class="soft"/><text x="398" y="568" class="h">Available</text><path d="M560 560 H610" class="line"/><rect x="610" y="520" width="190" height="80" class="soft"/><text x="638" y="568" class="h">On hold</text><path d="M800 560 H850" class="line"/><rect x="850" y="520" width="190" height="80" class="soft"/><text x="878" y="568" class="h">Sold</text><path d="M1040 560 H1090" class="line"/><rect x="1090" y="520" width="190" height="80" class="soft"/><text x="1118" y="568" class="h">History</text><rect x="170" y="710" width="1060" height="90" class="green"/>
<text x="192" y="746" class="h">Public card condition</text>
<text x="192" y="780" class="small">Public browse should only show listings that pass the combined policy: published, not removed, and not sold.</text> </svg>
