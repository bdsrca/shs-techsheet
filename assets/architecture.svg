<text x="1082" y="466" class="h">Email + Webhooks</text>
<text x="1082" y="500" class="small">Verification</text>
<text x="1082" y="522" class="small">Notifications</text>
<text x="1082" y="544" class="small">Reply relay direction</text>
<text x="1082" y="566" class="small">Webhook secrets</text> <path d="M195 340 V430" class="dash"/><path d="M515 340 V430" class="dash"/><path d="M835 340 V430" class="dash"/><path d="M1175 340 V430" class="dash"/><rect x="250" y="700" width="900" height="120" class="green"/>
<text x="272" y="736" class="h">Design rule</text>
<text x="272" y="770" class="small">The browser renders the experience. Server-side policies decide visibility, contactability, moderation, and state changes.</text> </svg>
