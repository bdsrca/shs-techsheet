<text x="1052" y="220" class="small">Email workflows</text>
<text x="1052" y="242" class="small">Cron cleanup</text>
<text x="1052" y="264" class="small">Cache revalidation</text>
<text x="1052" y="286" class="small">AI review jobs</text> <path d="M330 245 H380" class="line"/><path d="M650 245 H700" class="line"/><path d="M970 245 H1030" class="line"/><rect x="100" y="430" width="260" height="180" class="soft"/>
<text x="122" y="466" class="h">Auth and Profiles</text>
<text x="122" y="500" class="small">School-domain gate</text>
<text x="122" y="522" class="small">Public profile slice</text>
<text x="122" y="544" class="small">Admin roles</text>
<text x="122" y="566" class="small">Session boundary</text> <rect x="420" y="430" width="260" height="180" class="soft"/>
<text x="442" y="466" class="h">Postgres + RLS</text>
<text x="442" y="500" class="small">Listings</text>
<text x="442" y="522" class="small">Inquiries</text>
<text x="442" y="544" class="small">Messages</text>
<text x="442" y="566" class="small">Reports and logs</text> <rect x="740" y="430" width="260" height="180" class="soft"/>
<text x="762" y="466" class="h">Storage</text>
<text x="762" y="500" class="small">Private media bucket</text>
