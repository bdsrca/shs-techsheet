<text x="82" y="220" class="small">Homepage</text>
<text x="82" y="242" class="small">Marketplace browse</text>
<text x="82" y="264" class="small">Listing detail</text>
<text x="82" y="286" class="small">Safety, Privacy, Terms</text> <rect x="380" y="150" width="270" height="190" class="card"/>
<text x="402" y="186" class="h">Student Dashboard</text>
<text x="402" y="220" class="small">Profile setup</text>
<text x="402" y="242" class="small">Create and manage listings</text>
<text x="402" y="264" class="small">Saved items</text>
<text x="402" y="286" class="small">Inquiry threads</text> <rect x="700" y="150" width="270" height="190" class="card"/>
<text x="722" y="186" class="h">Admin Console</text>
<text x="722" y="220" class="small">Reports queue</text>
<text x="722" y="242" class="small">Listing moderation</text>
