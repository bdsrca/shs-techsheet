<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="850" viewBox="0 0 1400 850">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fbff"/>
      <stop offset="100%" stop-color="#eef5ff"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#1e3a8a" flood-opacity="0.12"/>
    </filter>
    <style>
      .title{font-family:Inter,Segoe UI,Arial,sans-serif;font-size:42px;font-weight:800;fill:#0f172a}
      .sub{font-family:Inter,Segoe UI,Arial,sans-serif;font-size:18px;fill:#475569}
      .h{font-family:Inter,Segoe UI,Arial,sans-serif;font-size:20px;font-weight:800;fill:#0f172a}
      .t{font-family:Inter,Segoe UI,Arial,sans-serif;font-size:15px;fill:#334155}
      .small{font-family:Inter,Segoe UI,Arial,sans-serif;font-size:13px;fill:#475569}
      .label{font-family:Inter,Segoe UI,Arial,sans-serif;font-size:14px;font-weight:700;fill:#1d4ed8}
      .card{fill:#ffffff;stroke:#bfdbfe;stroke-width:1.4;rx:22;filter:url(#shadow)}
      .soft{fill:#eff6ff;stroke:#bfdbfe;stroke-width:1.2;rx:16}
      .green{fill:#ecfdf5;stroke:#86efac}
      .orange{fill:#fff7ed;stroke:#fdba74}
      .purple{fill:#f5f3ff;stroke:#c4b5fd}
      .red{fill:#fff1f2;stroke:#fda4af}
      .line{stroke:#2563eb;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}
      .dash{stroke:#93c5fd;stroke-width:2;stroke-dasharray:6 8;fill:none}
    </style>
  </defs>
  <rect width="1400" height="850" rx="28" fill="url(#bg)"/>
<text x="54" y="70" class="title">Launch Readiness Scorecard</text><text x="56" y="105" class="sub">A student marketplace is ready when the boring checks are done.</text><rect x="90" y="165" width="1220" height="72" class="green" rx="16"/><text x="120" y="196" class="h">Public pages</text><text x="430" y="196" class="t">Homepage, marketplace, safety, terms, privacy, AI pages</text><text x="1240" y="207" font-family="Inter,Arial" font-size="28" fill="#16a34a">✓</text><rect x="90" y="253" width="1220" height="72" class="green" rx="16"/><text x="120" y="284" class="h">Auth</text><text x="430" y="284" class="t">School domains, callback URLs, reset links, safe errors</text><text x="1240" y="295" font-family="Inter,Arial" font-size="28" fill="#16a34a">✓</text><rect x="90" y="341" width="1220" height="72" class="green" rx="16"/><text x="120" y="372" class="h">Listings</text><text x="430" y="372" class="t">Draft/publish/pause/sold, media, validation</text><text x="1240" y="383" font-family="Inter,Arial" font-size="28" fill="#16a34a">✓</text><rect x="90" y="429" width="1220" height="72" class="green" rx="16"/><text x="120" y="460" class="h">Inquiries</text><text x="430" y="460" class="t">Contact policy, threads, unread state, closed flows</text><text x="1240" y="471" font-family="Inter,Arial" font-size="28" fill="#16a34a">✓</text><rect x="90" y="517" width="1220" height="72" class="orange" rx="16"/><text x="120" y="548" class="h">Safety</text><text x="430" y="548" class="t">Reports, admin review, abuse guard, audit logs</text><text x="1240" y="559" font-family="Inter,Arial" font-size="28" fill="#16a34a">✓</text><rect x="90" y="605" width="1220" height="72" class="orange" rx="16"/><text x="120" y="636" class="h">Email</text><text x="430" y="636" class="t">Sender domain, templates, confirm-then-POST links</text><text x="1240" y="647" font-family="Inter,Arial" font-size="28" fill="#16a34a">✓</text><rect x="90" y="693" width="1220" height="72" class="purple" rx="16"/><text x="120" y="724" class="h">Ops</text><text x="430" y="724" class="t">Cron, cleanup, cache revalidation, tests</text><text x="1240" y="735" font-family="Inter,Arial" font-size="28" fill="#16a34a">✓</text></svg>
