<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="850" viewBox="0 0 1400 850">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fbff"/>
      <stop offset="100%" stop-color="#eef5ff"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#1e3a8a" flood-opacity="0.12"/>
    </filter>
    <style>
      .title{font-family:Inter,Segoe UI,Arial,sans-serif;font-size:42px;font-weight:800;fill:#0f172a}
      .sub{font-family:Inter,Segoe UI,Arial,sans-serif;font-size:18px;fill:#475569}
      .h{font-family:Inter,Segoe UI,Arial,sans-serif;font-size:20px;font-weight:800;fill:#0f172a}
      .t{font-family:Inter,Segoe UI,Arial,sans-serif;font-size:15px;fill:#334155}
      .small{font-family:Inter,Segoe UI,Arial,sans-serif;font-size:13px;fill:#475569}
      .label{font-family:Inter,Segoe UI,Arial,sans-serif;font-size:14px;font-weight:700;fill:#1d4ed8}
      .card{fill:#ffffff;stroke:#bfdbfe;stroke-width:1.4;rx:22;filter:url(#shadow)}
      .soft{fill:#eff6ff;stroke:#bfdbfe;stroke-width:1.2;rx:16}
      .green{fill:#ecfdf5;stroke:#86efac}
      .orange{fill:#fff7ed;stroke:#fdba74}
      .purple{fill:#f5f3ff;stroke:#c4b5fd}
      .red{fill:#fff1f2;stroke:#fda4af}
      .line{stroke:#2563eb;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}
      .dash{stroke:#93c5fd;stroke-width:2;stroke-dasharray:6 8;fill:none}
    </style>
  </defs>
  <rect width="1400" height="850" rx="28" fill="url(#bg)"/>
<text x="54" y="70" class="title">AI Assisted Safety Loop</text><text x="56" y="105" class="sub">AI helps the queue stay awake. It does not replace student caution or admin judgment.</text><rect x="85" y="220" width="215" height="205" class="soft"/>
<text x="107" y="256" class="h">Listing saved</text>
<text x="107" y="290" class="small">Small payload</text>
<text x="107" y="312" class="small">Seller-safe context</text> <path d="M300 322 H345" class="line"/><rect x="345" y="220" width="215" height="205" class="card"/>
<text x="367" y="256" class="h">Background worker</text>
<text x="367" y="290" class="small">Budget caps</text>
<text x="367" y="312" class="small">Retries</text>
<text x="367" y="334" class="small">Hard stop</text> <path d="M560 322 H605" class="line"/><rect x="605" y="220" width="215" height="205" class="soft"/>
<text x="627" y="256" class="h">Finding stored</text>
<text x="627" y="290" class="small">Guidance</text>
<text x="627" y="312" class="small">Risk label</text>
<text x="627" y="334" class="small">Confidence</text> <path d="M820 322 H865" class="line"/><rect x="865" y="220" width="215" height="205" class="card"/>
<text x="887" y="256" class="h">Human decision</text>
<text x="887" y="290" class="small">Seller edits</text>
<text x="887" y="312" class="small">Admin reviews</text>
<text x="887" y="334" class="small">No guarantee</text> <path d="M1080 322 H1125" class="line"/><rect x="1125" y="220" width="215" height="205" class="soft"/>
<text x="1147" y="256" class="h">Feedback</text>
<text x="1147" y="290" class="small">Reports</text>
<text x="1147" y="312" class="small">Outcomes</text>
<text x="1147" y="334" class="small">Policy tuning</text> <path d="M1190 425 C1190 650 180 650 180 435" class="line"/><rect x="240" y="690" width="920" height="90" class="orange"/>
<text x="262" y="726" class="h">Guardrail</text>
<text x="262" y="760" class="small">AI output is a signal. Admins control moderation actions. Students still follow public-meetup safety basics.</text> </svg>
