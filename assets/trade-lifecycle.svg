<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fbff"/>
      <stop offset="100%" stop-color="#eef5ff"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#1e3a8a" flood-opacity="0.12"/>
    </filter>
    <style>
      .title{font-family:Inter,Segoe UI,Arial,sans-serif;font-size:42px;font-weight:800;fill:#0f172a}
      .sub{font-family:Inter,Segoe UI,Arial,sans-serif;font-size:18px;fill:#475569}
      .h{font-family:Inter,Segoe UI,Arial,sans-serif;font-size:20px;font-weight:800;fill:#0f172a}
      .t{font-family:Inter,Segoe UI,Arial,sans-serif;font-size:15px;fill:#334155}
      .small{font-family:Inter,Segoe UI,Arial,sans-serif;font-size:13px;fill:#475569}
      .label{font-family:Inter,Segoe UI,Arial,sans-serif;font-size:14px;font-weight:700;fill:#1d4ed8}
      .card{fill:#ffffff;stroke:#bfdbfe;stroke-width:1.4;rx:22;filter:url(#shadow)}
      .soft{fill:#eff6ff;stroke:#bfdbfe;stroke-width:1.2;rx:16}
      .green{fill:#ecfdf5;stroke:#86efac}
      .orange{fill:#fff7ed;stroke:#fdba74}
      .purple{fill:#f5f3ff;stroke:#c4b5fd}
      .red{fill:#fff1f2;stroke:#fda4af}
      .line{stroke:#2563eb;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}
      .dash{stroke:#93c5fd;stroke-width:2;stroke-dasharray:6 8;fill:none}
    </style>
  </defs>
  <rect width="1400" height="820" rx="28" fill="url(#bg)"/>
<text x="54" y="70" class="title">Student Trading Lifecycle</text><text x="56" y="105" class="sub">The product focuses on trusted matching and communication before payment.</text><circle cx="120" cy="185" r="24" fill="url(#blue)"/><text x="112" y="192" fill="#fff" font-size="18" font-weight="800" font-family="Inter,Arial">1</text><rect x="60" y="225" width="170" height="170" class="card"/>
<text x="82" y="261" class="h">Browse</text>
<text x="82" y="295" class="small">Open scan</text>
<text x="82" y="317" class="small">No signup required</text> <path d="M230 310 H275" class="line"/><circle cx="305" cy="185" r="24" fill="url(#blue)"/><text x="297" y="192" fill="#fff" font-size="18" font-weight="800" font-family="Inter,Arial">2</text><rect x="245" y="225" width="170" height="170" class="card"/>
<text x="267" y="261" class="h">Post</text>
<text x="267" y="295" class="small">School email</text>
<text x="267" y="317" class="small">Draft and publish</text> <path d="M415 310 H460" class="line"/><circle cx="490" cy="185" r="24" fill="url(#blue)"/><text x="482" y="192" fill="#fff" font-size="18" font-weight="800" font-family="Inter,Arial">3</text><rect x="430" y="225" width="170" height="170" class="card"/>
<text x="452" y="261" class="h">Review</text>
<text x="452" y="295" class="small">Quality guidance</text>
<text x="452" y="317" class="small">Moderation checks</text> <path d="M600 310 H645" class="line"/><circle cx="675" cy="185" r="24" fill="url(#blue)"/><text x="667" y="192" fill="#fff" font-size="18" font-weight="800" font-family="Inter,Arial">4</text><rect x="615" y="225" width="170" height="170" class="card"/>
<text x="637" y="261" class="h">Inquire</text>
<text x="637" y="295" class="small">Buyer asks</text>
<text x="637" y="317" class="small">No direct contact exposed</text> <path d="M785 310 H830" class="line"/><circle cx="860" cy="185" r="24" fill="url(#blue)"/><text x="852" y="192" fill="#fff" font-size="18" font-weight="800" font-family="Inter,Arial">5</text><rect x="800" y="225" width="170" height="170" class="card"/>
<text x="822" y="261" class="h">Chat</text>
<text x="822" y="295" class="small">Threaded messages</text>
<text x="822" y="317" class="small">Unread state</text> <path d="M970 310 H1015" class="line"/><circle cx="1045" cy="185" r="24" fill="url(#blue)"/><text x="1037" y="192" fill="#fff" font-size="18" font-weight="800" font-family="Inter,Arial">6</text><rect x="985" y="225" width="170" height="170" class="card"/>
<text x="1007" y="261" class="h">Meet</text>
<text x="1007" y="295" class="small">Public place</text>
<text x="1007" y="317" class="small">Pay in person</text> <path d="M1155 310 H1200" class="line"/><circle cx="1230" cy="185" r="24" fill="url(#blue)"/><text x="1222" y="192" fill="#fff" font-size="18" font-weight="800" font-family="Inter,Arial">7</text><rect x="1170" y="225" width="170" height="170" class="card"/>
<text x="1192" y="261" class="h">Resolve</text>
<text x="1192" y="295" class="small">Sold, rating</text>
<text x="1192" y="317" class="small">Report if needed</text> <path d="M1240 395 C1240 650 170 650 170 405" class="line"/><text x="500" y="710" class="h">Feedback loop: reports, ratings, moderation logs, and cleanup jobs improve the next cycle.</text></svg>
