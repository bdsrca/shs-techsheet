      .label{font-family:Inter,Segoe UI,Arial,sans-serif;font-size:14px;font-weight:700;fill:#1d4ed8}
      .card{fill:#ffffff;stroke:#bfdbfe;stroke-width:1.4;rx:22;filter:url(#shadow)}
      .soft{fill:#eff6ff;stroke:#bfdbfe;stroke-width:1.2;rx:16}
      .green{fill:#ecfdf5;stroke:#86efac}
      .orange{fill:#fff7ed;stroke:#fdba74}
      .purple{fill:#f5f3ff;stroke:#c4b5fd}
      .red{fill:#fff1f2;stroke:#fda4af}
      .line{stroke:#2563eb;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}
      .dash{stroke:#93c5fd;stroke-width:2;stroke-dasharray:6 8;fill:none}
    </style>
  </defs>
  <rect width="1400" height="900" rx="28" fill="url(#bg)"/>
<text x="54" y="70" class="title">Public Homepage Snapshot</text><text x="56" y="105" class="sub">Sanitized static view based on the public product shape. No private data is shown.</text><rect x="80" y="150" width="1240" height="650" rx="28" fill="#fff" stroke="#bfdbfe" filter="url(#shadow)"/><rect x="80" y="150" width="1240" height="70" rx="28" fill="#eff6ff" stroke="#bfdbfe"/><text x="120" y="195" class="h">SHS</text><text x="230" y="195" class="t">Browse     How it works     Inquiries     Log in     Join to Sell</text><text x="120" y="280" class="title">Local student classifieds</text><text x="122" y="318" class="sub">Browse first. Use school email when you want to post or message.</text><rect x="120" y="360" width="760" height="58" rx="18" fill="#f8fafc" stroke="#cbd5e1"/><text x="145" y="397" class="t">Search textbooks, calculators, tutoring, electronics...</text><rect x="900" y="360" width="160" height="58" rx="18" fill="#2563eb"/><text x="945" y="397" fill="#fff" font-family="Inter,Arial" font-size="18" font-weight="800">Browse</text><rect x="120" y="470" width="250" height="90" rx="20" fill="#eff6ff" stroke="#bfdbfe"/><text x="142" y="523" class="h">Books &amp; textbooks</text><rect x="405" y="470" width="250" height="90" rx="20" fill="#eff6ff" stroke="#bfdbfe"/><text x="427" y="523" class="h">Tutoring</text><rect x="690" y="470" width="250" height="90" rx="20" fill="#eff6ff" stroke="#bfdbfe"/><text x="712" y="523" class="h">Tech &amp; electronics</text><rect x="975" y="470" width="250" height="90" rx="20" fill="#eff6ff" stroke="#bfdbfe"/><text x="997" y="523" class="h">Sports &amp; fitness</text><rect x="120" y="610" width="250" height="90" rx="20" fill="#ffffff" stroke="#bfdbfe"/><text x="142" y="647" class="label">School domains</text><text x="142" y="677" class="h">live</text><rect x="405" y="610" width="250" height="90" rx="20" fill="#ffffff" stroke="#bfdbfe"/><text x="427" y="647" class="label">Region</text><text x="427" y="677" class="h">Peel</text><r