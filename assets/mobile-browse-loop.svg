<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="850" viewBox="0 0 1400 850">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fbff"/>
      <stop offset="100%" stop-color="#eef5ff"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#1e3a8a" flood-opacity="0.12"/>
    </filter>
    <style>
      .title{font-family:Inter,Segoe UI,Arial,sans-serif;font-size:42px;font-weight:800;fill:#0f172a}
      .sub{font-family:Inter,Segoe UI,Arial,sans-serif;font-size:18px;fill:#475569}
      .h{font-family:Inter,Segoe UI,Arial,sans-serif;font-size:20px;font-weight:800;fill:#0f172a}
      .t{font-family:Inter,Segoe UI,Arial,sans-serif;font-size:15px;fill:#334155}
      .small{font-family:Inter,Segoe UI,Arial,sans-serif;font-size:13px;fill:#475569}
      .label{font-family:Inter,Segoe UI,Arial,sans-serif;font-size:14px;font-weight:700;fill:#1d4ed8}
      .card{fill:#ffffff;stroke:#bfdbfe;stroke-width:1.4;rx:22;filter:url(#shadow)}
      .soft{fill:#eff6ff;stroke:#bfdbfe;stroke-width:1.2;rx:16}
      .green{fill:#ecfdf5;stroke:#86efac}
      .orange{fill:#fff7ed;stroke:#fdba74}
      .purple{fill:#f5f3ff;stroke:#c4b5fd}
      .red{fill:#fff1f2;stroke:#fda4af}
      .line{stroke:#2563eb;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}
      .dash{stroke:#93c5fd;stroke-width:2;stroke-dasharray:6 8;fill:none}
    </style>
  </defs>
  <rect width="1400" height="850" rx="28" fill="url(#bg)"/>
<text x="54" y="70" class="title">Mobile Browse Loop</text><text x="56" y="105" class="sub">The product is built for fast local scanning before signup.</text><rect x="90" y="170" width="360" height="560" rx="45" fill="#0f172a"/><rect x="115" y="210" width="310" height="470" rx="28" fill="#ffffff"/><text x="145" y="250" class="h">Search nearby</text><rect x="145" y="285" width="245" height="65" rx="14" fill="#eff6ff" stroke="#bfdbfe"/><text x="162" y="312" class="small">Exam Review Notes</text><text x="332" y="312" class="label">$14</text><text x="162" y="334" class="small">Available - Mississauga</text><rect x="145" y="370" width="245" height="65" rx="14" fill="#eff6ff" stroke="#bfdbfe"/><text x="162" y="397" class="small">Tablet for Reading</text><text x="332" y="397" class="label">$95</text><text x="162" y="419" class="small">Available - Mississauga</text><rect x="145" y="455" width="245" height="65" rx="14" fill="#eff6ff" stroke="#bfdbfe"/><text x="162" y="482" class="small">Mini Whiteboard</text><text x="332" y="482" class="label">$12</text><text x="162" y="504" class="small">Available - Mississauga</text><rect x="145" y="540" width="245" height="65" rx="14" fill="#eff6ff" stroke="#bfdbfe"/><text x="162" y="567" class="small">Group Tutoring</text><text x="332" y="567" class="label">$20</text><text x="162" y="589" class="small">Available - Mississauga</text><rect x="540" y="190" width="320" height="160" class="green"/>
<text x="562" y="226" class="h">Browse first</text>
<text x="562" y="260" class="small">No account needed to scan.</text>
<text x="562" y="282" class="small">The marketplace has to feel alive before signup.</text> <rect x="540" y="410" width="320" height="160" class="soft"/>
<text x="562" y="446" class="h">Account later</text>
<text x="562" y="480" class="small">School email unlocks saving, posting, and messaging.</text> <rect x="930" y="190" width="320" height="160" class="purple"/>
<text x="952" y="226" class="h">Message carefully</text>
<text x="952" y="260" class="small">Inquiries keep contact inside the app until a public meetup is clear.</text> <rect x="930" y="410" width="320" height="160" class="orange"/>
<text x="952" y="446" class="h">Meet simply</text>
<text x="952" y="480" class="small">Public place, item check, pay in person, walk away if off.</text> </svg>
