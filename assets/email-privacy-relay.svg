<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="850" viewBox="0 0 1400 850">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fbff"/>
      <stop offset="100%" stop-color="#eef5ff"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#1e3a8a" flood-opacity="0.12"/>
    </filter>
    <style>
      .title{font-family:Inter,Segoe UI,Arial,sans-serif;font-size:42px;font-weight:800;fill:#0f172a}
      .sub{font-family:Inter,Segoe UI,Arial,sans-serif;font-size:18px;fill:#475569}
      .h{font-family:Inter,Segoe UI,Arial,sans-serif;font-size:20px;font-weight:800;fill:#0f172a}
      .t{font-family:Inter,Segoe UI,Arial,sans-serif;font-size:15px;fill:#334155}
      .small{font-family:Inter,Segoe UI,Arial,sans-serif;font-size:13px;fill:#475569}
      .label{font-family:Inter,Segoe UI,Arial,sans-serif;font-size:14px;font-weight:700;fill:#1d4ed8}
      .card{fill:#ffffff;stroke:#bfdbfe;stroke-width:1.4;rx:22;filter:url(#shadow)}
      .soft{fill:#eff6ff;stroke:#bfdbfe;stroke-width:1.2;rx:16}
      .green{fill:#ecfdf5;stroke:#86efac}
      .orange{fill:#fff7ed;stroke:#fdba74}
      .purple{fill:#f5f3ff;stroke:#c4b5fd}
      .red{fill:#fff1f2;stroke:#fda4af}
      .line{stroke:#2563eb;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}
      .dash{stroke:#93c5fd;stroke-width:2;stroke-dasharray:6 8;fill:none}
    </style>
  </defs>
  <rect width="1400" height="850" rx="28" fill="url(#bg)"/>
<text x="54" y="70" class="title">Email and Privacy Relay</text><text x="56" y="105" class="sub">Email links and replies are treated as part of the security surface.</text><rect x="85" y="210" width="215" height="210" class="card"/>
<text x="107" y="246" class="h">Product email</text>
<text x="107" y="280" class="small">Verification</text>
<text x="107" y="302" class="small">Inquiry notice</text>
<text x="107" y="324" class="small">Rating reminder</text> <path d="M300 315 H345" class="line"/><rect x="345" y="210" width="215" height="210" class="card"/>
<text x="367" y="246" class="h">Confirm page</text>
<text x="367" y="280" class="small">GET opens page</text>
<text x="367" y="302" class="small">No state change yet</text> <path d="M560 315 H605" class="line"/><rect x="605" y="210" width="215" height="210" class="card"/>
<text x="627" y="246" class="h">Explicit POST</text>
<text x="627" y="280" class="small">User confirms</text>
<text x="627" y="302" class="small">Token consumed</text> <path d="M820 315 H865" class="line"/><rect x="865" y="210" width="215" height="210" class="card"/>
<text x="887" y="246" class="h">App record</text>
<text x="887" y="280" class="small">Profile update</text>
<text x="887" y="302" class="small">Rating saved</text>
<text x="887" y="324" class="small">Thread event</text> <path d="M1080 315 H1125" class="line"/><rect x="1125" y="210" width="215" height="210" class="card"/>
<text x="1147" y="246" class="h">Audit trail</text>
<text x="1147" y="280" class="small">Email event</text>
<text x="1147" y="302" class="small">Moderation context</text>
<text x="1147" y="324" class="small">Retry notes</text> <rect x="130" y="560" width="520" height="150" class="orange"/>
<text x="152" y="596" class="h">Why GET should not write</text>
<text x="152" y="630" class="small">Mail scanners and previews can open links before a human does. State changes should happen only after a deliberate POST.</text> <rect x="760" y="560" width="520" height="150" class="green"/>
<text x="782" y="596" class="h">Reply relay direction</text>
<text x="782" y="630" class="small">If inbound replies are enabled, webhooks need secrets, normalization, and minimal public signals.</text> </svg>
